repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black --check
        language: system
        types: [python]
        files: ^app/
        exclude: ^app/migrations/
      
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        files: ^app/
        exclude: ^app/migrations/
      
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        files: ^app/
        exclude: ^app/migrations/
