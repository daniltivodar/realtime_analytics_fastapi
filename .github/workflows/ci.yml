name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'poetry'
    
    - name: Install Poetry
      run: pip install poetry
    
    - name: Install dependencies
      run: poetry install --with dev
    
    - name: Check formatting
      run: poetry run black --check app/
    
    - name: Run linter
      run: poetry run ruff check app/
    
    - name: Check types
      run: poetry run mypy app/

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'poetry'
    
    - name: Install Poetry
      run: pip install poetry
    
    - name: Install dependencies
      run: poetry install --with dev
    
    - name: Run tests with SQLite
      env:
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        SECRET_KEY: "test-key-${{ github.run_id }}"
        ENVIRONMENT: "test"
      run: |
        poetry run pytest tests/ \
          -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          --tb=short
