name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Poetry
      run: |
          pip install poetry
          poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --with dev

    - name: Check formatting
      run: poetry run black --check app/

    - name: Run linter
      run: poetry run ruff check app/

    - name: Check types
      run: poetry run mypy app/

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Poetry
      run: |
          pip install poetry
          poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: poetry install --with dev

    - name: Run tests with SQLite
      env:
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        SECRET_KEY: "test-key-${{ github.run_id }}"
        SECRET: "dummy-test-secret-key-${{ github.run_id }}"
        POSTGRES_PASSWORD: "dummy-postgres-password"
        REDIS_PASSWORD: "dummy-redis-password"
        RABBITMQ_PASSWORD: "dummy-rabbitmq-password"
        FLOWER_PASSWORD: "dummy-flower-password"
        POSTGRES_DB: "analytics"
        POSTGRES_USER: "user"
        REDIS_URL: "redis://localhost:6379"
        CELERY_BROKER_URL: "amqp://guest:guest@localhost:5672//"
        CELERY_RESULT_BACKEND: "redis://:password@localhost:6379/0"
        RABBITMQ_USER: "guest"
        FLOWER_USER: "admin"
        ENVIRONMENT: "test"
      run: |
        poetry run pytest tests/ \
          -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          --tb=short
